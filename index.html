<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON SKYRUN 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb}
#score{position:fixed;top:15px;left:15px;color:white;font:bold 24px Arial;z-index:5}
#buttons{position:fixed;bottom:25px;left:0;right:0;text-align:center;z-index:5}
button{font-size:30px;width:75px;height:65px;margin:8px;border:0;border-radius:15px;background:#ffffff99}
</style>
</head>
<body>

<div id="score">Score: 0</div>

<div id="buttons">
<button onclick="move(-1)">⬅️</button>
<button onclick="move(1)">➡️</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(
  70,innerWidth/innerHeight,.1,1000
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

/* LIGHT */
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff,.5));

/* ROAD */
const road=new THREE.Mesh(
  new THREE.BoxGeometry(12,.2,200),
  new THREE.MeshStandardMaterial({color:0x303030})
);
road.position.y=-.1;
scene.add(road);

/* GRASS */
const grass=new THREE.Mesh(
  new THREE.BoxGeometry(60,.15,200),
  new THREE.MeshStandardMaterial({color:0x238b45})
);
grass.position.y=-.2;
scene.add(grass);

/* CAR */
const car=new THREE.Group();

const body=new THREE.Mesh(
  new THREE.BoxGeometry(2,0.6,3.5),
  new THREE.MeshStandardMaterial({color:0xff1744})
);
body.position.y=.55;
car.add(body);

const top=new THREE.Mesh(
  new THREE.BoxGeometry(1.4,.55,1.6),
  new THREE.MeshStandardMaterial({color:0x222222})
);
top.position.set(0,.95,.1);
car.add(top);

/* WHEELS */
for(const x of [-1.05,1.05]){
  for(const z of [-1.1,1.1]){
    const wheel=new THREE.Mesh(
      new THREE.CylinderGeometry(.38,.38,.25,16),
      new THREE.MeshStandardMaterial({color:0x111111})
    );
    wheel.rotation.z=Math.PI/2;
    wheel.position.set(x,.35,z);
    car.add(wheel);
  }
}

car.position.set(0,0,6);
scene.add(car);

/* OBSTACLES */
const obstacles=[];
let timer=0;
let score=0;

function createObstacle(){
  const o=new THREE.Mesh(
    new THREE.BoxGeometry(1.7,1.7,1.7),
    new THREE.MeshStandardMaterial({color:0xff8c00})
  );

  o.position.set(
    [-4,-2,0,2,4][Math.floor(Math.random()*5)],
    .85,
    -80
  );

  scene.add(o);
  obstacles.push(o);
}

/* CAMERA */
camera.position.set(0,5,12);
camera.lookAt(0,0,0);

/* CONTROLS */
function move(direction){
  car.position.x+=direction*1.5;
  car.position.x=Math.max(-4.5,Math.min(4.5,car.position.x));
}

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1);
});

/* GAME LOOP */
function animate(){
  requestAnimationFrame(animate);

  timer++;

  if(timer>70){
    createObstacle();
    timer=0;
  }

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];

    o.position.z+=.45;

    if(
      Math.abs(o.position.x-car.position.x)<1.5 &&
      Math.abs(o.position.z-car.position.z)<2
    ){
      alert("CRASH! Score: "+score);
      location.reload();
    }

    if(o.position.z>15){
      scene.remove(o);
      obstacles.splice(i,1);
      score++;
      document.getElementById("score").textContent="Score: "+score;
    }
  }

  renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
