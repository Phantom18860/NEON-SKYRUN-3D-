<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON SKYRUN 3D</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  background:#050510;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}
canvas{display:block}
#ui{
  position:fixed;
  top:15px;
  left:15px;
  z-index:5;
  font-size:20px;
  text-shadow:0 0 10px #fff;
}
#message{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#050510aa;
  z-index:10;
  text-align:center;
}
button{
  border:0;
  padding:15px 30px;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}
.hidden{display:none!important}
#controls{
  position:fixed;
  bottom:25px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:20px;
  z-index:6;
}
.control{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#ffffff22;
  color:white;
  border:2px solid #ffffff66;
  font-size:28px;
}
</style>
</head>

<body>

<div id="ui">
  SCORE: <span id="score">0</span>
</div>

<div id="message">
  <h1>NEON SKYRUN 3D</h1>
  <p>Move left and right. Dodge the blocks!</p>
  <button onclick="startGame()">PLAY</button>
</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
</div>

<script>
const canvas=document.createElement("canvas");
document.body.appendChild(canvas);
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

let playerX=0;
let obstacles=[];
let score=0;
let running=false;
let speed=5;

function startGame(){
  playerX=0;
  obstacles=[];
  score=0;
  speed=5;
  running=true;
  document.getElementById("message").classList.add("hidden");
}

function spawn(){
  obstacles.push({
    x:(Math.random()*2-1)*0.75,
    z:1
  });
}

function move(dir){
  if(!running)return;
  playerX+=dir*0.12;
  playerX=Math.max(-0.85,Math.min(0.85,playerX));
}

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1);
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1);
  if(e.code==="Space"&&!running)startGame();
});

document.getElementById("left").addEventListener("pointerdown",()=>move(-1));
document.getElementById("right").addEventListener("pointerdown",()=>move(1));

let spawnTimer=0;

function gameOver(){
  running=false;
  document.getElementById("message").classList.remove("hidden");
  document.querySelector("#message h1").textContent="GAME OVER";
  document.querySelector("#message p").textContent=
    "Final score: "+score;
  document.querySelector("#message button").textContent="PLAY AGAIN";
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // sky
  let sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#080820");
  sky.addColorStop(1,"#020207");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // horizon
  let horizon=H*0.48;

  // road
  ctx.fillStyle="#111122";
  ctx.beginPath();
  ctx.moveTo(W*.35,horizon);
  ctx.lineTo(W*.65,horizon);
  ctx.lineTo(W*.95,H);
  ctx.lineTo(W*.05,H);
  ctx.closePath();
  ctx.fill();

  // road lines
  ctx.strokeStyle="#5555ff";
  ctx.lineWidth=3;

  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(W/2+i*W*.08,horizon);
    ctx.lineTo(W/2+i*W*.45,H);
    ctx.stroke();
  }

  // stars
  for(let i=0;i<50;i++){
    let x=(i*97)%W;
    let y=(i*53)%(horizon-20);
    ctx.fillStyle="white";
    ctx.fillRect(x,y,2,2);
  }

  // player
  let px=W/2+playerX*W*.3;
  let py=H*.82;
  ctx.fillStyle="#00ffff";
  ctx.shadowBlur=25;
  ctx.shadowColor="#00ffff";
  ctx.fillRect(px-22,py-35,44,55);
  ctx.shadowBlur=0;

  // obstacles
  for(const o of obstacles){
    let t=1-o.z;
    let x=W/2+o.x*W*.35*t;
    let y=horizon+(H-horizon)*t;
    let size=20+70*t;

    ctx.fillStyle="#ff2266";
    ctx.shadowBlur=20;
    ctx.shadowColor="#ff2266";
    ctx.fillRect(x-size/2,y-size/2,size,size);
    ctx.shadowBlur=0;
  }
}

function update(){
  if(running){
    spawnTimer++;

    if(spawnTimer>45){
      spawn();
      spawnTimer=0;
    }

    for(const o of obstacles)o.z-=0.018*speed;

    obstacles=obstacles.filter(o=>{
      if(o.z<0.08){
        let close=Math.abs(o.x-playerX)<0.18;
        if(close){
          gameOver();
          return false;
        }
        score++;
        document.getElementById("score").textContent=score;
        speed+=0.03;
        return false;
      }
      return true;
    });
  }

  draw();
  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
